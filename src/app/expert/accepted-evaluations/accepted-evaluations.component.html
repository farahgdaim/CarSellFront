<div class="container mt-5 accepted-evals-page">
    <h2 class="mb-4" style="color:#1d2e5f;">Demandes acceptées<br><small class="text-muted">en attente de rapport</small></h2>
  
    <div *ngIf="!demandes.length" class="alert alert-info">
      Aucune demande acceptée pour le moment.
    </div>
  
    <div class="row g-4">
      <div class="col-12" *ngFor="let d of demandes">
        <div class="card p-4 shadow-sm">
          <ng-container *ngIf="evaluationDetails[d.id]?.demandeur">
            <h5 style="color:#1d2e5f;">
              Demande de {{ evaluationDetails[d.id].demandeur.nom }} {{ evaluationDetails[d.id].demandeur.prenom }}
            </h5>
          </ng-container>
          <ng-container *ngIf="evaluationDetails[d.id]?.annonce">
            <p><strong>Annonce :</strong> {{ evaluationDetails[d.id].annonce.titre }}</p>
          </ng-container>
          <!-- <h5 style="color:#1d2e5f;">Demande de {{ evaluationDetails[d.id]?.demandeur?.nom }} {{evaluationDetails[d.id]?.demandeur?.prenom}}</h5> -->
          <!-- <p><strong>Annonce :</strong> {{ evaluationDetails[d.id]?.annonce?.titre  }}</p> -->
          <div class="text-end">
            <button class="btn btn-primary" (click)="viewReportForm(d.id)">
              📝 Remplir rapport
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
