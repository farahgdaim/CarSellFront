<div class="container mt-4 notification-list-page">
  <h2>Mes Notifications</h2>
  
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <ul class="list-group" *ngIf="notifications && notifications.length > 0; else noNotifications">
    <li class="list-group-item" *ngFor="let notification of notifications; let i = index">
      <div class="notification-item">
        <div class="notification-content">
          <p class="notification-text"><strong>Contenu :</strong> {{ notification.contenu }}</p>
          <p class="notification-date"><small><strong>Date :</strong> {{ notification.date | date:'short' }}</small></p>
          <p class="notification-status"><small><strong>Statut :</strong> {{ notification.statut }}</small></p>
          <!-- Removed display of notification.id or notification._id for user-friendliness -->
        </div>
        <div *ngIf="notification.statut === 'non_lu'" class="notification-action">
          <button class="btn mark-btn" (click)="markNotificationAsRead(notification)">Marquer comme lue</button>
        </div>        
      </div>
    </li>
  </ul>

  <ng-template #noNotifications>
    <div class="no-notifications">
      <p>Aucune notification pour le moment.</p>
    </div>
  </ng-template>
</div>
