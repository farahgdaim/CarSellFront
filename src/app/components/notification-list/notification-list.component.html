<div class="container mt-4">
    <h2>Mes Notifications</h2>
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
    <ul class="list-group">
      <li class="list-group-item" *ngFor="let notification of notifications; let i = index">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <p><strong>Contenu:</strong> {{ notification.contenu }}</p>
            <p><small><strong>Date:</strong> {{ notification.date | date:'short' }}</small></p>
            <p><small><strong>Statut:</strong> {{ notification.statut }}</small></p>
          </div>
          <!-- Show the button only if the notification is not yet read -->
          <div *ngIf="notification.statut === 'non_lu'">
            <button class="btn btn-sm btn-primary" (click)="markNotificationAsRead(i)">Marquer comme lue</button>
          </div>
        </div>
      </li>
    </ul>
  </div>
