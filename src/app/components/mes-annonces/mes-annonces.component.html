    <div class="col-lg-9 col-md-8"id="annonces" >
        <div class="row">
            <div class="col-lg-4 col-md-6 col-sm-12 d-flex" *ngFor="let ann of annonces">
                <div class="card annonce-card w-100 my-2 shadow-2-strong" [routerLink]="['/annonce', ann.id]"(click)="goToAnnonceDetails(ann.id)">
                    <img [src]="'http://127.0.0.1:8000' + ann.images[0]?.url" alt="Image de l'annonce"class="card-img-top"
                    style="aspect-ratio: 1 / 1"
                    alt="Image de l'annonce" />

                     


                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title" style="color: #1d2e5f;font-weight: 700;">{{ann.titre}}</h5>
                        <p>{{ann.description}}</p>
                        <p class="card-text fw-bold">{{ann.prix}} TND</p>

                        <!-- Infos supplémentaires avec icônes -->
                        <div class="row text-muted small">
                            <div class="col-6"><i class="fas fa-car"></i> {{ann.vehicule['Marque']}} /
                                {{ann.vehicule['Modèle']}}</div>
                            <div class="col-6"><i class="fas fa-tachometer-alt"></i>
                                {{ann.vehicule['Kilométrage']}} km</div>
                            <div class="col-6"><i class="fas fa-gas-pump"></i>
                                {{ann.vehicule.TypeCarburant}}</div>
                            <div class="col-6"><i class="fas fa-cogs"></i> {{ann.vehicule.boiteVitesse}}
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
        

    </div>
  </div>
