<div class="container-fluid vh-100 login-register-page">
  <div class="row h-100">
    <!-- Left Panel avec fond personnalisé -->
    <div class="col-md-6 d-none d-md-block p-0">
      <!-- Remplacer l'URL par une image pertinente pour l'automobile -->
      <div class="login-register-bg" style="background: url('https://via.placeholder.com/800x800?text=Votre+Image+Ici') no-repeat center center; background-size: cover;"></div>
    </div>
    <!-- Right Panel avec formulaire et animation fade-slide -->
    <div class="col-md-6 d-flex align-items-center justify-content-center">
      <div class="form-container fade-slide">
        <h2 class="mb-4" style="color:#1d2e5f;">Bienvenue chez EliteAuto !</h2>
        <p class="mb-4" style="color:#555;">Veuillez saisir vos informations pour accéder à votre espace personnel.</p>

        <form (submit)="login(); $event.preventDefault();">
          <div class="mb-3">
            <label for="email" class="form-label" style="font-weight: bold;">Adresse e-mail</label>
            <input type="text" id="email" class="form-control" [(ngModel)]="credentials.email" name="email" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label" style="font-weight: bold;">Mot de passe</label>
            <input type="password" id="password" class="form-control" [(ngModel)]="credentials.password" name="password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100" style="background-color:#1d2e5f; border: none;">Se connecter</button>
          
          <!-- Success and Error Feedback -->
          <div *ngIf="success" class="alert alert-success">{{ success }}</div>
          <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
        </form>
        <p class="mt-3" style="text-align: center;">
          Vous n'avez pas de compte ?
          <a routerLink="/register" class="link-red" style="color:#B22222; text-decoration: underline;">Inscrivez-vous ici</a>
        </p>
      </div>
    </div>
  </div>
</div>
