<div class="container-fluid vh-100">
  <div class="row h-100">
    <!-- Left Panel -->
    <div class="col-md-6 d-none d-md-block p-0">
      <div class="h-100" style="background: url('https://via.placeholder.com/800x800') no-repeat center center; background-size: cover;"></div>
    </div>
    <!-- Right Panel -->
    <div class="col-md-6 d-flex align-items-center justify-content-center">
      <div class="w-75">
        <h2 class="mb-4">Bienvenue chez EliteAuto !</h2>
        <p class="mb-4">Veuillez saisir vos informations pour accéder à votre espace personnel.</p>
        <form (submit)="login(); $event.preventDefault();">
          <div class="mb-3">
            <label for="email" class="form-label">Adresse e-mail</label>
            <input type="text" id="email" class="form-control" [(ngModel)]="credentials.email" name="email" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Mot de passe</label>
            <input type="password" id="password" class="form-control" [(ngModel)]="credentials.password" name="password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Se connecter</button>
          <!-- Display error messages -->
          <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>
        </form>
      </div>
    </div>
  </div>
</div>
