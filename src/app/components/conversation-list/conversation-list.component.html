<div class="container mt-4 conversation-list-page">
  <h2 class="mb-4">Mes Conversations</h2>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div class="row">
    <div class="col-md-6" *ngFor="let conv of conversations">
      <div class="card mb-3" (click)="viewConversation(conv)" style="cursor: pointer;">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <h5 class="card-title">
              
              <span class="other-user">{{ conv.otherUserName }}</span>
            </h5>
            <p class="card-text">
              <small>{{ conv.lastMessage || 'Aucun message' }}</small>
            </p>
          </div>
        </div>
        
        <button class="btn p-0 border-0 bg-transparent" (click)="deleteConversation(conv, $event)" title="Supprimer">
          <i class="bi bi-trash text-danger fs-5"></i>
        </button>

      </div>
    </div>
  </div>
</div>
