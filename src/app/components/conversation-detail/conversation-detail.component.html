<div class="container mt-4" *ngIf="conversation; else errorTemplate">
  <!-- Conversation Header -->
  <h2 class="text-center text-primary">
    Conversation avec {{ conversation.user1?.nom || 'Utilisateur' }} et {{ conversation.user2?.nom || 'Utilisateur' }}
  </h2>

  <!-- Messages Display -->
  <div class="card mb-4">
    <div class="card-body chat-window">
      <div *ngIf="conversation.messages && conversation.messages.length > 0; else noMessages">
        <div *ngFor="let msg of conversation.messages" class="mb-3 message-item" 
             [ngClass]="{'sent': msg.senderId === userId1, 'received': msg.senderId !== userId2}">
          <p class="message-content">{{ msg.contenu }}</p>
          <p class="message-timestamp text-muted small">{{ msg.dateEnvoi | date:'short' }}</p>
        </div>
      </div>
      <ng-template #noMessages>
        <p class="text-center text-muted">Aucun message pour le moment.</p>
      </ng-template>
    </div>
  </div>

  <!-- Send Message Section -->
  <div class="message-input">
    <textarea class="form-control" rows="2" placeholder="Écrivez un message..." [(ngModel)]="newMessage" name="newMessage"></textarea>
    <button class="btn btn-primary mt-2 w-100" (click)="sendMessage()">Envoyer</button>
  </div>
</div>

<!-- Error Template -->
<ng-template #errorTemplate>
  <div class="alert alert-danger mt-4">
    {{ error }}
  </div>
</ng-template>
