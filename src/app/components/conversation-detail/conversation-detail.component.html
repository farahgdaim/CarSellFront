<div class="container mt-4 conversation-detail-page" *ngIf="conversation; else errorTemplate">
  <!-- Chat Header -->
  <div class="chat-header">
    <div class="d-flex align-items-center">
      <div class="avatar">
        <i class="fas fa-user"></i>
      </div>
      <div>
        <h4 class="chat-title">
          {{ conversation.user2?.nom || 'Chat Participant' }} {{ conversation.user2?.prenom || '' }}
        </h4>
      </div>
    </div>
    <div class="chat-actions">
      <i class="fa-solid fa-video"></i>
    </div>
  </div>

  <!-- Chat Messages Container -->
  <div class="chat-messages">
    <div #chatContainer class="messages-container" style="height: 60vh; overflow-y: auto;">
      <div *ngIf="conversation.messages && conversation.messages.length > 0; else noMessages">
        <div *ngFor="let msg of conversation.messages" class="message-container">
          <!-- Received Message -->
          <div *ngIf="msg.senderId !== userId1" class="message received">
            <div class="message-content">
              <div class="message-text">{{ msg.contenu }}</div>
              <div class="message-time">
                <small>{{ msg.dateEnvoi | date:'shortTime' }}</small>
              </div>
            </div>
          </div>
          <!-- Sent Message -->
          <div *ngIf="msg.senderId === userId1" class="message sent">
            <div class="message-content">
              <div class="message-text">{{ msg.contenu }}</div>
              <div class="message-time">
                <small>{{ msg.dateEnvoi | date:'shortTime' }}</small>
              </div>
            </div>
          </div>
        </div>
      </div>
      <ng-template #noMessages>
        <div class="no-messages">
          Aucun message pour le moment. Commencez la conversation!
        </div>
      </ng-template>
    </div>
  </div>
  
  <!-- Message Input Area -->
  <div class="message-input">
    <div class="input-group">
      <textarea 
        class="form-control" 
        rows="2" 
        placeholder="Écrivez votre message..." 
        [(ngModel)]="newMessage" 
        name="newMessage"
        (keydown.enter)="sendMessage()"
      ></textarea>
      <div class="input-group-append">
        <button class="btn send-btn" (click)="sendMessage()">
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<ng-template #errorTemplate>
  <div class="alert alert-danger mt-4">{{ error }}</div>
</ng-template>
