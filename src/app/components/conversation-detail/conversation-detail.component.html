<div class="chat-container" *ngIf="conversation; else errorTemplate">
  <!-- Chat Header -->
  <div class="chat-header">
    <h2>
      Chat with {{ conversation.user1?.nom || 'User One' }} &amp; {{ conversation.user2?.nom || 'User Two' }}
    </h2>
  </div>

  <!-- Chat Body -->
  <div class="chat-body">
    <div class="messages">
      <div *ngIf="conversation.messages && conversation.messages.length > 0; else noMessages">
        <div *ngFor="let msg of conversation.messages" 
             class="message-item" 
             [ngClass]="{'sent': msg.senderId === userId1, 'received': msg.senderId !== userId1}">
          <div class="message-content">{{ msg.contenu }}</div>
          <div class="message-timestamp">{{ msg.dateEnvoi | date:'shortTime' }}</div>
        </div>
      </div>
      <ng-template #noMessages>
        <div class="no-messages">No messages yet. Start the conversation!</div>
      </ng-template>
    </div>
  </div>

  <!-- Chat Input -->
  <div class="chat-input">
    <textarea class="form-control" rows="2" placeholder="Type your message..." [(ngModel)]="newMessage"></textarea>
    <button class="btn btn-primary" (click)="sendMessage()">Send</button>
  </div>
</div>


<ng-template #errorTemplate>
  <div class="alert alert-danger mt-4">
    {{ error }}
  </div> 
</ng-template>
