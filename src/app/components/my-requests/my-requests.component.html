<div class="container mt-5 my-requests-page">
    <h2 class="mb-4" style="color:#1d2e5f;">Mes demandes d’évaluation</h2>
  
    <div *ngIf="!myRequests.length" class="alert alert-info">
      Vous n’avez envoyé aucune demande.
    </div>
  
    <div class="row g-4">
      <div class="col-md-6 col-lg-4" *ngFor="let item of myRequests; let i = index">
        <div class="card p-4 shadow-sm">
          <h5 style="color:#1d2e5f;">
            Annonce : {{ item.annonce.titre || 'Titre non disponible' }}
          </h5>
          <p><strong>Statut :</strong> <span class="text-capitalize">{{ item.demande.status }}</span></p>
          <div class="mt-3 text-end">
            <button class="btn btn-outline-primary me-2" (click)="viewDetail(item)">Détails</button>
            <button 
              *ngIf="item.demande.status === 'pending'" 
              class="btn btn-danger" 
              (click)="cancel(item.demande.id, i)">
              Annuler
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
