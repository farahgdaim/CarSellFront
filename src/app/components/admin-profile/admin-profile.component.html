<header><app-admin-navbar></app-admin-navbar></header>

<div class="container">
  <div class="main-body">

    <br><br>

    <div class="row gutters-sm">
      <div class="col-md-4 mb-3">
        <div class="card">
          <div class="card-body">
            <div class="d-flex flex-column align-items-center text-center">
              <img src="https://bootdey.com/img/Content/avatar/avatar7.png" alt="Admin" class="rounded-circle"
                width="150">
              <div class="mt-3">
                <h4>{{ admin.nom }}</h4>
                <p class="text-secondary mb-1">administrateur du site Elite auto</p>
              </div>
            </div>
          </div>
        </div>

      </div>
      <div class="col-md-8">
        <div class="card mb-3">
          <div class="card-body">
            <div class="row">
              <div class="col-sm-3">
                <h6 class="mb-0">Nom</h6>
              </div>
              <div class="col-sm-9 text-secondary">
                {{ admin.nom }}
              </div>
            </div>
            <hr>
            <div class="row">
              <div class="col-sm-3">
                <h6 class="mb-0">Prenom</h6>
              </div>
              <div class="col-sm-9 text-secondary">
                {{ admin.prenom }}
              </div>
            </div>
            <hr>
            <div class="row">
              <div class="col-sm-3">
                <h6 class="mb-0">Email</h6>
              </div>
              <div class="col-sm-9 text-secondary">
                {{ admin.email }}
              </div>
            </div>
            <hr>



            <div class="row">
              <div class="col-sm-12">
                <a class="btn btn-info " target="__blank" (click)="logout()">Déconnexion</a>
              </div>
            </div>
          </div>
        </div>





      </div>
    </div>

  </div>
</div>
