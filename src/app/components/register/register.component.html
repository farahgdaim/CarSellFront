<div class="container-fluid vh-100 login-register-page">
  <div class="row h-100">
    <!-- Left Panel avec fond personnalisé -->
    <div class="col-md-6 d-none d-md-block p-0">
      <div class="login-register-bg">
        <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.webp"
          class="img-fluid" alt="Sample image">
      </div>

    </div>
    <!-- Right Panel avec formulaire et animation fade-slide -->
    <div class="col-md-6 d-flex align-items-center justify-content-center">
      <div class="form-container fade-slide">
        <h2 class="mb-3" style="color:#1d2e5f;">Inscrivez-vous sur EliteAuto</h2>
        <p class="mb-4" style="color:#555;">Rejoignez EliteAuto dès aujourd'hui pour profiter de toutes nos fonctionnalités !</p>
        
        <form (submit)="register(); $event.preventDefault();">
          <div class="mb-3">
            <label for="nom" class="form-label" style="font-weight: bold;">Nom</label>
            <input type="text" id="nom" class="form-control" [(ngModel)]="user.nom" name="nom" required>
          </div>
          <div class="mb-3">
            <label for="prenom" class="form-label" style="font-weight: bold;">Prénom</label>
            <input type="text" id="prenom" class="form-control" [(ngModel)]="user.prenom" name="prenom" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label" style="font-weight: bold;">Adresse e-mail</label>
            <input type="email" id="email" class="form-control" [(ngModel)]="user.email" name="email" required>
          </div>
          <div class="mb-3">
            <label for="telephone" class="form-label" style="font-weight: bold;">Téléphone</label>
            <input type="text" id="telephone" class="form-control" [(ngModel)]="user.telephone" name="telephone" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label" style="font-weight: bold;">Mot de passe</label>
            <input type="password" id="password" class="form-control" [(ngModel)]="user.password" name="password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100" style="background-color:#1d2e5f; border: none;">S'inscrire</button>
          
          <!-- Success and Error Feedback -->
          <div *ngIf="success" class="alert alert-success">{{ success }}</div>
          <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
        </form>
        <p class="mt-3" style="text-align: center;">
          Vous avez déjà un compte ?
          <a routerLink="/login" class="link-red" style="color:#B22222; text-decoration: underline;">Connectez-vous ici</a>
        </p>
      </div>
    </div>
  </div>
</div>
