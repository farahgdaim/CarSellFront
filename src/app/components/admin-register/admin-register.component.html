<div class="container-fluid vh-100">
    <div class="row h-100">
      <!-- Left Panel: Placeholder image -->
      <div class="col-md-6 d-none d-md-block p-0">
        <div class="h-100" style="background: url('https://via.placeholder.com/800x800') no-repeat center center; background-size: cover;"></div>
      </div>
      <!-- Right Panel: Registration Form -->
      <div class="col-md-6 d-flex align-items-center justify-content-center">
        <div class="w-75">
          <h2 class="mb-4">Admin - Inscription</h2>
          <form (submit)="register(); $event.preventDefault();">
            <div class="mb-3">
              <label for="nom" class="form-label">Nom</label>
              <input type="text" id="nom" class="form-control" [(ngModel)]="adminData.nom" name="nom" required>
            </div>
            <div class="mb-3">
                <label for="nom" class="form-label">Prenom</label>
                <input type="text" id="prenom" class="form-control" [(ngModel)]="adminData.prenom" name="prenom" required>
              </div>
            <div class="mb-3">
              <label for="email" class="form-label">Adresse e-mail</label>
              <input type="email" id="email" class="form-control" [(ngModel)]="adminData.email" name="email" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Mot de passe</label>
              <input type="password" id="password" class="form-control" [(ngModel)]="adminData.password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">S'inscrire</button>
            <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>
          </form>
        </div>
      </div>
    </div>
  </div>
